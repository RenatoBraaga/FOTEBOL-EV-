name: Executar Robô EV+ FutBET

on:
  workflow_dispatch: # Permite disparar o robô manualmente no GitHub a qualquer momento
  schedule:
    - cron: '0 11 * * *' # Executa automaticamente todos os dias às 08:00 (BRT) / 11:00 (UTC)

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Engine Master EV+
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CSV_FILE_PATH: "jogos_filtrados_notebooklm_v4.csv"
        run: |
          python main.py
